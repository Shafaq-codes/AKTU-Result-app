<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKTU Name Result – Search AKTU Result by Name</title>

  <!-- Auth Guard: Validate persistent session in localStorage and Cookie -->
  <script>
    (function() {
      try {
        function getCookie(name) {
          const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
          return match ? decodeURIComponent(match[2]) : null;
        }
        let session = localStorage.getItem('aktu_user_session');
        if (!session) {
          session = getCookie('aktu_user_session');
          if (session) localStorage.setItem('aktu_user_session', session);
        }
        if (!session) {
          window.location.replace('/login.html');
          return;
        }
        const parsed = JSON.parse(session);
        if (!parsed || !parsed.email) {
          localStorage.removeItem('aktu_user_session');
          window.location.replace('/login.html');
        }
      } catch (e) {
        window.location.replace('/login.html');
      }
    })();
  </script>

  <!-- Service Worker Registration for Instant Offline Cache -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=20260903_v1').catch(() => {});
      });
    }
  </script>

  <link rel="stylesheet" href="style.css?v=20260818_v2">
  <link rel="icon" href="https://erp.aktu.ac.in/Images/Site/FileHandler-new.png" type="image/png">
</head>
<body class="search-body">
  
  <!-- Authenticated Top Navigation Header -->
  <div class="auth-top-header">
    <div class="user-profile-badge" id="userBadge" style="display: none;">
      <img id="userAvatarImg" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Profile" class="user-avatar">
      <div class="user-info-text">
        <span class="user-display-name" id="userDisplayName">Student</span>
        <span class="user-display-email" id="userDisplayEmail">user@gmail.com</span>
      </div>
      <a href="javascript:void(0)" class="logout-link" id="logoutBtn" title="Sign out from this session">Logout</a>
    </div>

    <!-- Navigation to Roll Number Search -->
    <a href="/index.html" class="top-right-nav-btn">Search by Roll Number</a>
  </div>

  <div class="search-card" style="position: relative; overflow: hidden;">
    
    <!-- Loading Overlay -->
    <div class="loading-box" id="loadingOverlay">
      <img src="https://oneview.aktu.ac.in/Images/Site/loading.gif" alt="Loading" class="loader-gif">
      <div class="loader-title" id="loadingStateText">Searching Database...</div>
      <div style="font-size: 10px; color: #666666;" id="loadingSubtext">Retrieving student records...</div>
    </div>

    <!-- Official AKTU Logo -->
    <img src="https://erp.aktu.ac.in/Images/Site/FileHandler-new.png" alt="AKTU Logo" class="search-logo">
    
    <!-- English Title -->
    <h1 class="search-title">AKTU OneView</h1>
    
    <!-- Inputs -->
    <div class="input-group">
      <!-- Input ID is kept rollNumberInput to reuse exact CSS styling -->
      <input type="text" id="rollNumberInput" placeholder="Student Name" class="roll-input" maxlength="35" autocomplete="off">
    </div>
    
    <!-- Button -->
    <button class="proceed-btn" id="searchBtn">SEARCH</button>

    <!-- Name Search Results Picker (Duplicate Matches) -->
    <div id="nameSearchContainer" style="display: none; max-height: 200px; overflow-y: auto; border-top: 1px solid #eeeeee; margin-top: 15px; padding-top: 10px; text-align: left;">
      <div style="font-size: 11px; font-weight: bold; color: #555555; margin-bottom: 8px; border-bottom: 1px solid #eeeeee; padding-bottom: 3px;">Multiple Matches Found:</div>
      <div id="nameSearchList" style="display: flex; flex-direction: column; gap: 4px;"></div>
    </div>

    <!-- Error Message Display -->
    <div id="errorMessageContainer" style="display: none; margin-top: 15px; border-top: 1px solid #eeeeee; padding-top: 10px; text-align: center;">
      <div id="errorMessageText" style="color: #cc0000; font-size: 12px; font-weight: bold; margin-bottom: 10px;">Result not found.</div>
      <div style="font-size: 10px; color: #666666; margin-bottom: 12px;">Please make sure to write the full name correctly, or try searching by Roll Number.</div>
      <a href="/index.html" class="proceed-btn" style="display: inline-block; text-decoration: none; padding: 8px 16px; font-size: 11px; width: auto; background-color: #8b251e;">TRY WITH ROLL NUMBER</a>
    </div>
  </div>

  <script src="security.js?v=20260822_v1"></script>
  <script src="students-data.js?v=20260903_v1"></script>
  <script src="name-search.js?v=20260903_v1"></script>
</body>
</html>
