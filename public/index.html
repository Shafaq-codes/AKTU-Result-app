<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AKTU OneView – Student Result Portal</title>
  <link rel="icon" href="/assets/aktu_logo.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css?v=4.0">
  <meta name="theme-color" content="#721313">
  <script>
    (function() {
      var isAndroidApp = !!window.AndroidBridge;
      var isWebView = /;\s*wv\b|Version\/4\.0.*Chrome/i.test(navigator.userAgent);
      var isAppParam = window.location.search.indexOf('app=android') !== -1;
      if (!isAndroidApp && !isWebView && !isAppParam) {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body class="search-body">

  <div class="search-card" id="searchCard">
    <img src="/assets/aktu_logo.png" alt="AKTU Emblem" class="search-logo">
    <h1 class="search-title">AKTU OneView</h1>

    <!-- Roll Input -->
    <div class="input-group">
      <input 
        type="tel" 
        id="rollNumberInput" 
        class="roll-input" 
        placeholder="Enter Roll Number" 
        maxlength="14"
        autocomplete="off"
        autofocus
      >
    </div>

    <!-- Search Button -->
    <div style="text-align: center; margin-top: 20px;">
      <button class="proceed-btn" id="searchBtn">
        SEARCH
      </button>
    </div>
  </div>

  <!-- DOB Not Found Modal -->
  <div class="modal-backdrop" id="dobModalBackdrop" style="display: none;">
    <div class="dob-modal-card">
      <div class="dob-modal-icon">📅</div>
      <h2 class="dob-modal-title">Date of Birth Not Found</h2>
      <p class="dob-modal-subtitle">
        इस रोल नंबर का DOB रिकॉर्ड में उपलब्ध नहीं है। कृपया अपना DOB दर्ज करें:
      </p>

      <div class="input-group" style="margin-top: 15px;">
        <input 
          type="text" 
          id="manualDobInput" 
          class="roll-input" 
          placeholder="DD/MM/YYYY (e.g. 15/08/2003)" 
          maxlength="10"
          autocomplete="off"
        >
      </div>

      <div id="dobErrorMsg" class="dob-error-text" style="display: none;"></div>

      <div class="dob-modal-actions">
        <button class="proceed-btn" id="submitManualDobBtn" style="margin-top: 10px; width: 100%;">
          PROCEED & VERIFY
        </button>
        <button class="secondary-btn" id="newSearchBtn" style="margin-top: 10px; width: 100%;">
          🔄 NEW SEARCH
        </button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div class="loading-title" id="loadingTitle">Checking Records...</div>
      <div class="loading-subtext" id="loadingSubtext">Connecting to AKTU Academic Server</div>
    </div>
  </div>

  <script src="/js/app.js?v=4.0"></script>
</body>
</html>
