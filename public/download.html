  <style>

      margin: 0;

    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .landing-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
    }

    .nav-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 700;
    }

    /* Hero Section */
    .hero-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px 40px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
      flex: 1;
    }

    .hero-content {
      flex: 1;
      max-width: 540px;
    }

    .hero-heading {
      font-size: 42px;
      line-height: 1.2;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    .hero-heading span {
      background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 16px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 35px;
    }

    /* Download Button */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      transition: all 0.25s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(16, 185, 129, 0.5);
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
    }

    /* Phone Mockup Frame */
    .phone-mockup-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .phone-frame {
      width: 290px;
      height: 560px;
      background: #000000;
      border: 10px solid #334155;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .phone-notch {
      width: 120px;
      height: 18px;
      background: #334155;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 10;
    }

    .phone-screen {
      flex: 1;
      background: #1a202c url('/assets/aktu_bg.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .mini-card {
      background: #ffffff;
      padding: 25px 15px;
      border-radius: 10px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .mini-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 8px;
    }

    .mini-title {
      font-size: 15px;
      font-weight: bold;
      color: #721313;
      margin-bottom: 12px;
    }

    .mini-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 10px;
      text-align: center;
    }

    .mini-btn {
      width: 100%;
      padding: 8px;
      background: #721313;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    /* Desktop Viewport Rules (No scrolling on Desktop, Exact Original Sizes) */
    @media (min-width: 851px) {
      html, body {
        height: 100vh;
        overflow: hidden;
      }

      .landing-nav {
        padding: 12px 40px;
      }

      .hero-container {
        padding: 0 20px;
      }
    }

    /* Mobile Viewport Rules (Scrollable on mobile) */
    @media (max-width: 850px) {
      html, body {
        min-height: 100vh;
        height: auto;
        overflow-y: auto;
      }

      .hero-container {
        flex-direction: column;
        text-align: center;
        padding: 30px 20px 40px 20px;
      }

      .hero-content {
        max-width: 100%;
      }

      .landing-nav {
        padding: 15px 20px;
      }

      .hero-heading {
        font-size: 32px;
      }
    }
  </style>
</head>

            <button class="mini-btn">SEARCH RESULT</button>

</body>
</html>
